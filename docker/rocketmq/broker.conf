# =============================================================================
#  RocketMQ Broker 配置（容器内路径：/home/rocketmq/rocketmq-5.3.2/conf/broker.conf）
#
#  这份文件里绝大多数行都可以用默认值，下面只逐条解释「为什么必须显式写出来」。
#  凡是没写的项都是 Broker 默认值，刻意保持不动 —— 少写一行就少一个
#  「本地验证结果与生产不一致」的来源。
# =============================================================================

brokerClusterName = DefaultCluster
brokerName = broker-a

# brokerId = 0 表示 Master。
# 本项目不需要主从：MQ 在链路里承担的只是「把确认订单+扣库存搬到独立线程池」，
# 消息可靠性由本地消息表（seckill_outbox）兜底，而不是由 Broker 的副本数兜底。
# 因此刻意不引入 SLAVE，避免多一个「看起来更可靠、实际上没人验证过」的组件。
brokerId = 0

# -----------------------------------------------------------------------------
# 【本文件最关键的一行】brokerIP1
#
# Broker 启动后会把自己的「可被客户端连接的地址」注册到 NameServer。若不指定，
# 它会自动探测网卡地址 —— 在容器里探测到的就是 172.x.x.x 这个容器内网地址。
# 于是 host 上的 Spring Boot 应用从 NameServer 拿到 172.x 之后根本连不上，
# 现象是：NameServer 一切正常、Broker 日志显示注册成功、但应用一投消息就超时。
#
# 本项目应用以 host 进程运行（见 docker-compose.yml 文件头的设计边界说明），
# 因此这里固定为 127.0.0.1，配合 compose 里 `10911:10911` 的端口发布，
# 应用拿到的地址恰好就是它真正能连上的地址。
#
# 【换到别的机器时】若你把应用也容器化并放进同一个 compose 网络，
# 这里要改成 `brokerIP1 = rocketmq-broker`（服务名），而不是 127.0.0.1 ——
# 后者在容器网络里指向它自己。这是一个改了端口/拓扑就必须同步改的地方。
# -----------------------------------------------------------------------------
brokerIP1 = 127.0.0.1

# 监听端口。10911 是客户端端口，10909 是 HA 端口；两个都要在 compose 里发布，
# 否则客户端拿到路由后仍可能连不上（HA 端口在单 Master 下不参与数据同步，
# 但客户端/运维工具会去探它）。
listenPort = 10911

# -----------------------------------------------------------------------------
# 【这里刻意**不**写 haListenPort】
#
# 曾经写过 `haListenPort = 10909`，实测导致 Broker 无限重启：
#     java.lang.IllegalStateException: Failed to bind to 0.0.0.0:10909
#     Caused by: java.net.BindException: Address already in use
#         at BrokerController.startBasicService(BrokerController.java:1669)
#
# 原因是 RocketMQ 5.3.2 内部**自己**就会占用 10909（HA 服务的默认端口即
# listenPort - 2），显式再声明一次等于让同一端口在同一进程内被绑两次。
#
# 症状具有误导性：宿主机上查 10909 会看到它属于 com.docker.backend
# （那只是 Docker 的端口转发代理），很容易误判成「别的程序抢了端口」。
#
# 反证：同样的 compose，只要去掉这一行就 boot success ——
# 镜像默认值与我们要的完全一致，显式覆盖它没有任何收益。
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# 自动创建 Topic
#
# 允许自动创建是「可重复验证」的必要条件：故障注入实验会反复
# `docker compose down -v` 重建环境，若每次都要手工 mqadmin updateTopic，
# 任何一次遗漏都会表现为「消息投不出去」而不是「Topic 不存在」，
# 是一个把配置问题伪装成代码问题的经典陷阱。
#
# 默认队列数 4 与消费线程数（consume-thread-min: 4）对齐：
# RocketMQ 的并发消费按队列分配线程，队列数少于线程数时多出来的线程永远空闲，
# 会让「调大消费线程数」看起来毫无效果（本项目 B 轮压测已实测到这一点）。
# -----------------------------------------------------------------------------
autoCreateTopicEnable = true
defaultTopicQueueNums = 4
autoCreateSubscriptionGroup = true

# 单个 Topic 在每个 Broker 上的队列数上限（自动创建时使用，见上）
maxMessageSize = 4194304

# -----------------------------------------------------------------------------
# 刷盘与主从同步策略
#
# ASYNC_FLUSH + ASYNC_MASTER：消息先写 PageCache 即向客户端确认。
# 这是「吞吐优先」的取法，代价是 Broker 进程/机器崩溃可能丢最后一批消息。
# 本项目可以接受这个代价，理由是链路的正确性并没有押在 Broker 上：
#   - 消息丢了 → 订单停在 PENDING → 对账的「陈旧未了结」会把它报出来；
#   - 消息重复 → 消费端的 `UPDATE ... WHERE status='PENDING'` 影响行数即幂等键。
# 反过来若改成 SYNC_FLUSH，每次投递都要等磁盘 fsync，
# 投递吞吐会从约 490 条/秒掉到个位数，outbox 会直接积压 —— 用它换来的可靠性，
# 对账本来就已经提供了。
# -----------------------------------------------------------------------------
flushDiskType = ASYNC_FLUSH
brokerRole = ASYNC_MASTER

# 磁盘占用超过 88% 时拒绝写入。
# 留出余量是因为 Prometheus 的 TSDB 与 MySQL 数据卷都在同一块盘上：
# 磁盘写满时最先崩的会是 MySQL 而不是 MQ，而 MySQL 崩掉的表现（订单无法落库）
# 会让人误以为是代码缺陷。
diskMaxUsedSpaceRatio = 88

# 消息保留时长（小时）。默认 72 小时对本项目过长：
# 故障注入实验一轮只跑几分钟，保留 72 小时意味着每轮都在盘上留下一批
# 永远不会被消费的测试消息，几轮之后 store 目录就会大到影响容器启动时间。
deleteWhen = 04
fileReservedTime = 24

# -----------------------------------------------------------------------------
# 消费重试与死信
#
# retryTimesWhenConsumeFailed 与 Spring 侧的 `seckill.mq.max-reconsume-times: 3`
# 是**两套计数**，必须一起看：
#   - 客户端 `maxReconsumeTimes`（默认取 seckill.mq.max-reconsume-times=3）
#     决定消费端在第几次重试时放弃、转为「取消订单 + 归还预扣」；
#   - Broker 的 `maxReconsumeTimes` 决定 %RETRY% 队列里的消息什么时候进死信。
# 客户端先到上限，因此正常情况下消息不会进 DLQ。
#
# 这里刻意不调大 Broker 的值：SPEC 第 18 节与消费端注释都说明了
# 「这类消息转人工审阅、不可一键重放」是刻意的设计 ——
# 库存已经归还，若从 DLQ 重放并成功确认订单，就是超卖（不可修复）。
# -----------------------------------------------------------------------------
maxReconsumeTimes = 3
sendMessageThreadPoolNums = 8
useReentrantLockWhenPutMessage = true

# 事务消息不需要：本项目的「本地事务 + 消息表」是 Outbox 模式，
# 而不是 RocketMQ 的 transaction message。打开它只会多一份无用的回查线程。
transactionCheckInterval = 60000

# -----------------------------------------------------------------------------
# 【这里刻意不设 storePathRootDir / storePathCommitLog】
#
# 曾经显式写过这两行，实测导致 Broker 启动即崩：
#     java.lang.NullPointerException
#         at ScheduleMessageService.configFilePath(...)
#         at BrokerController.shutdownBasicService(...)
# 真实原因是具名卷属主为 root 而容器以 uid=3000 运行（见 docker-compose.yml 里
# rocketmq-init 的说明），但**报出来的错指向路径解析**，排查方向会被带偏。
#
# 教训是：容器官方镜像的默认路径（$HOME/store）本来就是
# /home/rocketmq/store，与挂载点一致。显式重写它不产生任何收益，
# 却多引入一个「路径解析」的失败面。默认值能用就不要覆盖。
# -----------------------------------------------------------------------------

# =============================================================================
#  指标导出（SPEC 第 6.1 节的 MQ 指标 / 批次 1 任务 1.4）
#
#  【这里为什么不是 JMX Exporter】
#  最初的方案（可行性报告 §3.1 冲突 3）是「挂 jmx_prometheus_javaagent 读 Broker 的
#  JMX MBean」。实测证明这条路在 RocketMQ 5.x 上**根本不存在**：
#
#    $ jar tf rocketmq-broker-5.3.2.jar | grep -ci mbean     → 0
#    $ jcmd <broker-pid> ManagementAgent.start_local
#      → 平台 MBeanServer 里只有 java.lang / java.nio / com.sun.management 等
#        23 个 JDK 自带的 ObjectName，**一个 org.apache.rocketmq 都没有**
#
#  也就是说该镜像里连一个 RocketMQ 的 MBean 都没有，装多少 Exporter 都读不到东西。
#  可行性报告里「官方镜像带了 jmx_prometheus_javaagent 的 jar」这句也是错的：
#    $ find / -iname '*jmx*' → 只有 JDK 自带的 sample/management 目录
#  RocketMQ 5.x 已把监控整体换成 OpenTelemetry，MBean 是 4.x 的形态。
#
#  【实际采用的方案】用 Broker 内置的 Prometheus 导出器（OTel 的 PROM exporter）：
#    - 零新增依赖、零新增容器（镜像里本来就带着
#      opentelemetry-exporter-prometheus-1.29.0-alpha.jar）；
#    - 直接给出 SPEC 要的 mq_lag 精确值：rocketmq_consumer_lag_messages
#      （还有 lag_latency / inflight / ready / queueing_latency 四个更细的口径）。
#
#  【指标名的实际形态】OTel 的 Prometheus 导出器不加 instrumentation scope 前缀，
#  因此暴露出来的就是 BrokerMetricsConstant 里的原始名字。抓一次即可确认：
#    $ docker compose exec rocketmq-broker curl -s localhost:5557/metrics | grep lag
#  这一条「先抓一次看真实名字」的纪律很重要 —— 猜名字写出来的告警规则
#  会永远停在 inactive，而 PromQL 对「序列不存在」不报错。
# =============================================================================

# DISABLE(默认) / OTLP_GRPC / PROM / LOG。这里选 Pull 模式的 PROM，
# 与项目其余部分（Prometheus 采集应用 /actuator/prometheus）保持同一种模型。
metricsExporterType = PROM

# 导出器监听端口，默认值就是 5557。显式写出来是为了让「Prometheus 该抓哪里」
# 这件事在配置里有唯一可查的来源 —— 默认值能用，但那个数字散落在文档里迟早对不上。
metricsPromExporterPort = 5557

# -----------------------------------------------------------------------------
# 【必须显式设成 0.0.0.0，这是实测踩到的一处】
#
# 这一项的默认值是 `brokerIP1`，也就是 127.0.0.1。看起来「只绑回环更安全」，
# 但它让 **Prometheus 抓不到**：
#     $ docker compose exec prometheus wget -qO- http://rocketmq-broker:5557/metrics
#     wget: can't connect to remote host (172.19.0.5): Connection refused
# 原因是 Prometheus 跑在容器里，它连的是 Broker 容器的 eth0（172.19.0.5），
# 而导出器只在那个容器的 lo 上监听 —— 从宿主机的端口映射能 curl 通，
# 所以「本机测着是好的」会一直误导人往 Prometheus 配置上找原因。
# Prometheus 里表现为 rocketmq-broker 这个 target 长期 DOWN，
# 而 MQ 相关的所有指标一条都不存在（PromQL 对「序列不存在」不报错）。
#
# 【这样放宽安全吗】可以，且理由具体：
#   1) 5557 只发布到宿主机的回环（见 docker-compose.yml），不经 Docker Desktop
#      的端口转发对外暴露，局域网内其它机器连不上；
#   2) compose 网络是独立的 bridge，能访问 5557 的只有同一栈里的容器
#      （Prometheus / Grafana / 一次性的 init）；
#   3) 这个端点是**只读**的指标文本，没有任何写操作或管理接口。
# 若将来把应用也容器化并放进同一个网络，或者把 compose 网络改成 macvlan/宿主机网络，
# 这条就要重新评估。
# -----------------------------------------------------------------------------
metricsPromExporterHost = 0.0.0.0



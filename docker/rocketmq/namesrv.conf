# =============================================================================
#  RocketMQ NameServer 配置（容器内路径：/home/rocketmq/rocketmq-5.3.2/conf/namesrv.conf）
#
#  【为什么这个文件几乎是空的】NameServer 是一个无状态的轻量路由注册中心：
#  它不存消息、不做选举、节点之间也不互相通信。因此它几乎没有需要调的参数，
#  默认值就是生产值。这里只显式写下两件与「本机验证」直接相关的事。
#
#  刻意保持极简的收益：NameServer 出问题时可以立刻排除「配置改错了」这一可能，
#  它只剩「进程是否活着」与「Broker 有没有注册上来」两种故障态。
# =============================================================================

# -----------------------------------------------------------------------------
# 监听端口
#
# 默认即 9876。显式写出来是为了让它与 compose 里的端口发布形成一处可见的对应：
# 改端口时如果只改了 compose 而漏了这里，症状是「容器起来了但应用连不上」，
# 而 NameServer 自己的日志看起来完全正常（它确实在监听，只是监听的不是那个端口）。
# -----------------------------------------------------------------------------
listenPort = 9876

# -----------------------------------------------------------------------------
# JVM 以外不做任何定制。
#
# 【排查用】Broker 是否已注册上来，可以在容器里执行：
#   docker exec -it seckill-rocketmq-namesrv sh -c \
#     'sh mqadmin clusterList -n 127.0.0.1:9876'
# 若列表里没有 broker-a，说明 Broker 没注册成功，
# 此时去看 Broker 日志（docker logs seckill-rocketmq-broker），
# 头号嫌疑是 brokerIP1 配置 —— 见 docker/rocketmq/broker.conf 里的说明。
# -----------------------------------------------------------------------------

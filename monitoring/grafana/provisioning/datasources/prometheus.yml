# =============================================================================
#  Grafana 数据源自动装载
#
#  【为什么要用 provisioning 而不是手工在 UI 里点】
#  手工配的数据源只存在于 grafana-data 卷里。一旦执行 `docker compose down -v`
#  （故障注入实验反复重建环境的常规动作），看板与数据源会一起消失，
#  而这恰恰也是**告警规则**所在的位置 —— 于是「换台机器验证」变成了
#  「先花半小时重配监控」，验证的意愿会因此下降。
#  声明式装载让「删库重来」变成一条命令。
#
#  【uid 为什么必须显式固定】Dashboard 的 JSON 里用 uid 引用数据源。
#  不指定时 Grafana 会随机生成一个，导致每次重建环境后所有看板都报
#  "Datasource not found"，且必须逐个面板手工重选。
# =============================================================================

apiVersion: 1

# 允许删除本文件声明的数据源之外，不做任何清理。
# 保持默认（不写 deleteDatasources）是刻意的：
# 运维手工加的数据源不该被一次重启清掉。
datasources:

  # ---------------------------------------------------------------------------
  # Prometheus：指标的唯一查询入口
  # ---------------------------------------------------------------------------
  - name: Prometheus
    uid: seckill-prometheus
    type: prometheus
    access: proxy
    # 容器网络内的服务名。Grafana 与 Prometheus 同在 seckill-net 上，
    # 因此直接用服务名即可 —— 不需要 host.docker.internal。
    url: http://prometheus:9090
    isDefault: true
    editable: false   # 声明式管理的对象不应在 UI 里被改，否则下次重启会被静默覆盖

    jsonData:
      # -----------------------------------------------------------------------
      # 【这一行决定了「看不到数据」时该怎么排查】
      # timeInterval 让 Grafana 知道 Prometheus 的采集周期，从而在
      # `$__rate_interval` 一类变量上自动取足够宽的窗口。
      # 不设置时 Grafana 默认按 15s 处理 —— 恰好与本项目一致，
      # 但仍显式写出来：一旦有人把 scrape_interval 调成 30s 而漏了这里，
      # rate() 会因窗口内样本不足而丢点，表现为曲线随机出现断口。
      # -----------------------------------------------------------------------
      timeInterval: 15s

      # 用 POST 查询：PromQL 表达式变长时 GET 的 URL 长度会成为限制
      httpMethod: POST

      # -----------------------------------------------------------------------
      # Exemplar 关联（本期关闭，二期打开）
      #
      # 打开它需要指标侧写入 trace_id（OpenTelemetry / Micrometer Tracing），
      # 本项目 MVP 阶段没有引入链路追踪（SPEC 第 27 节把 OTel/Jaeger 明确列为二期）。
      # 在这里留一条注释而不是留一行配置，是为了避免「配置看起来支持但实际没有数据」
      # —— 那种状态比不支持更让人困惑。
      # -----------------------------------------------------------------------
      # exemplarTraceIdDestinations:
      #   - name: trace_id
      #     datasourceUid: seckill-tempo

    # 版本固定：Grafana 升级时数据源 schema 可能变化，固定版本让「一定是配置问题」
    # 与「可能是版本差异」这两类判断可以分开做。
    version: 1

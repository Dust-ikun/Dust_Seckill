# =============================================================================
#  记录规则（Recording Rules）
#
#  【为什么要先做记录规则，而不是在告警里直接算 P99】
#  三个具体理由，缺一个都不足以justify这一层：
#   1) 成本：`histogram_quantile` 要在查询时展开每个桶做插值。Grafana 上开一个
#      带 8 条曲线的 P99 面板，每条曲线都要重算一遍；记录规则把它变成一次预计算，
#      面板与告警读的是同一份结果。
#   2) 一致性：告警里的 P99 与看板上的 P99 必须是同一个数。
#      各写一遍 PromQL 的必然结果是「面板显示 1.02s、告警却按 1.10s 触发」，
#      而差的那 0.08s 恰恰是排查时最容易被误读为「指标不准」的东西。
#   3) 可读性：告警表达式应当只说「什么算异常」，
#      不该顺带承担「P99 该怎么算」这件事（那是统计口径，不是告警逻辑）。
#
#  【命名约定】录制出来的指标名以 `seckill:` 开头，冒号是 Prometheus 社区
#  约定的「这条时间序列不来自 exporter，而是规则算出来的」标记。
# =============================================================================

groups:

  # ===========================================================================
  #  一、HTTP 层派生指标（QPS / P95 / P99 / 错误率 / 超时率）
  # ===========================================================================
  - name: seckill-http-derived
    interval: 15s
    rules:

      # -----------------------------------------------------------------------
      # 接口 P99 延迟（按 uri 与 status 细分）
      #
      # 【`> 0` 这个筛选不能省】没有请求经过的 (uri, status) 组合，其所有桶计数
      # 都是 0，`histogram_quantile` 会返回 NaN。NaN 参与 `or` 与比较时行为反直觉
      # （NaN > 1.0 为 false，但 NaN 也 != NaN），把它挡在源头比在告警里处理更省事。
      # -----------------------------------------------------------------------
      - record: seckill:http_p99_latency:5m
        expr: |
          histogram_quantile(
            0.99,
            sum by (uri, status, service, le) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          ) > 0

      - record: seckill:http_p95_latency:5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (uri, status, service, le) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          ) > 0

      # -----------------------------------------------------------------------
      # 接口 QPS（按 uri 细分）
      # -----------------------------------------------------------------------
      - record: seckill:http_qps:1m
        expr: |
          sum by (uri, service) (
            rate(http_server_requests_seconds_count[1m])
          )

      # -----------------------------------------------------------------------
      # 5xx 错误率（0~1 的小数，不是百分比）
      #
      # 【为什么分母要包一层 sum 再除，而不是用 `sum by (...)` 一次算完】
      # 分子按 uri 聚合、分母也必须按 uri 聚合，两者标签集不一致时
      # PromQL 的除法会静默丢掉所有匹配不上的序列。这里显式分开算再加 `and`，
      # 是为了让「标签集必须一致」这个约束在表达式里看得见。
      #
      # 【为什么扫 `le` 之外还要 `status=~"5.."`】Micrometer 为每次请求记录了
      # status 标签，5xx 与 4xx 必须分开：4xx（库存不足、重复下单）是本项目的
      # **正常业务响应**，把它算进错误率会让错误率在这个系统里永远高于阈值，
      # 那条告警就会因为一直响而被忽略 —— 这比没有告警更糟。
      # -----------------------------------------------------------------------
      # 【为什么末尾要有 `or (0 * 分母)` 这一段（批次 2 修正）】
      # 除法的分子在「没有任何 5xx」时是**空序列**，而 PromQL 的 `空 / 非空`
      # 结果仍然是**空序列**（不是 0）。于是这条记录规则在一个健康的系统上
      # 根本不产生任何样本 —— 表现是「这条指标不存在」，而不是「错误率为 0」。
      # 两者的后果完全不同：
      #   - Grafana 面板是空白（读的人以为图表坏了）；
      #   - Agent 查 http_error_rate 得到空结果，而空结果会被读成「没有数据」，
      #     进而无法区分「查不到」与「错误率为 0」；
      #   - 依赖它的 seckill:pipeline_health_score 因为乘了一个空序列，
      #     也**永远不会存在**（健康系统上总分面板永久空白）。
      # `0 * 分母` 会用与分母**完全相同的标签集**造出一组值为 0 的序列，
      # 因此当分子为空时，这条规则表达的是「这些 uri 的 5xx 比例是 0」
      # —— 这正是事实。这一段是把「查不到」变成「确知为 0」的唯一手段。
      - record: seckill:http_error_rate:5m
        expr: |
          (
            sum by (uri, service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            sum by (uri, service) (rate(http_server_requests_seconds_count[5m]))
          )
          or
          (
            0 * sum by (uri, service) (rate(http_server_requests_seconds_count[5m]))
          )

      # -----------------------------------------------------------------------
      # 全服务错误率（不按 uri 细分，供「整体健康度」这类告警使用）
      # 末尾的 `or (0 * 分母)` 理由同上。
      # -----------------------------------------------------------------------
      - record: seckill:http_error_rate_all:5m
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count[5m]))
          )
          or
          (
            0 * sum(rate(http_server_requests_seconds_count[5m]))
          )

      # -----------------------------------------------------------------------
      # 慢请求占比（> 1s 的请求占全部请求的比例）
      #
      # 【为什么用「慢请求占比」而不是另造一条 seckill_timeout_total】
      # 本项目没有「超时」的独立埋点，能观测到的只有两件事：请求耗时，以及 5xx。
      # 时长与错误率已经能完整刻画「超时」这个现象，再伪造一条计数指标，
      # 只是把推测包装成数据 —— 这与 SPEC 第 10 节「不得伪造不存在的指标」
      # 是同一条规则，只是约束对象从 Agent 换成了我们自己。
      #
      # 【实现为什么能用 le="1.0"】Micrometer 的默认 HTTP 直方图桶包含
      # 1.0 这个边界（以及 1.5/2.5/5/10 等业务上更关心的点），因此
      # 「<= 1s 的计数 / 总计数」可以直接从桶里读出来，不必自建直方图。
      # 若将来调整了 histogram buckets（management.metrics.distribution.*），
      # 这里必须同步核对 le="1.0" 是否仍然存在 —— 桶不存在时该序列会整体消失，
      # 而 PromQL 对「序列不存在」和「值为 0」的处理完全不同：
      # 前者会让告警永远只停在 inactive，是一种静默失效。
      # -----------------------------------------------------------------------
      - record: seckill:http_slow_request_rate:5m
        expr: |
          1 - (
            sum by (uri, service) (rate(http_server_requests_seconds_bucket{le="1.0"}[5m]))
            /
            sum by (uri, service) (rate(http_server_requests_seconds_count[5m]))
          )

  # ===========================================================================
  #  二、业务链路派生指标（成功率 / Outbox / MQ 速率）
  # ===========================================================================
  - name: seckill-business-derived
    interval: 15s
    rules:

      # -----------------------------------------------------------------------
      # 下单受理速率（对应 SPEC 的 order_total）
      # -----------------------------------------------------------------------
      - record: seckill:order_accept_rate:1m
        expr: |
          sum(rate(seckill_request_queued_total[1m]))

      # -----------------------------------------------------------------------
      # 订单确认成功率
      #
      # 【分子分母都用「消费侧」的口径，不能拿受理数当分母】
      # 受理数（queued）与确认数（confirmed）之间隔着投递与消费两级异步，
      # 两者天然有在途差额。用 queued 做分母算出来的「成功率」在活动刚开始的
      # 几十秒内必然很低 —— 那是异步链路的启动延迟，不是失败。
      # 因此分母取「消费侧已结案总数」：确认 + 取消 + 重试耗尽放弃。
      # 这个口径的含义是「已经走到终态的消息里，有多少是成功的」。
      # -----------------------------------------------------------------------
      # 【`and (分母 > 0)` 这一段是批次 2 补的，防的是 NaN】
      # 没有任何已结案消息时分子分母同时为 0，而 PromQL 的 `0 / 0` 得到的是
      # **NaN 而不是空** —— 于是这条指标「存在但值是 NaN」。NaN 比「不存在」更麻烦：
      #   - 它会被 sum/avg 传播（一个 NaN 污染整条聚合曲线）；
      #   - 任何与它比较的表达式恒为 false（`NaN < 0.99` 是 false，告警因此静默）；
      #   - 它是**第三种状态**，而本项目已经把「空 ≠ 0」定为口径约定
      #     （见 docs/批次2_Tool层与验收.md §5），再引入 NaN 会让读的人无从判断。
      # `and (分母 > 0)` 让这条序列在「还没有结案消息」时**不存在**，
      # 那正是事实：空闲的系统没有成功率可言。
      - record: seckill:order_success_rate:5m
        expr: |
          (
            sum(rate(seckill_consume_confirmed_total[5m]))
            /
            (
              sum(rate(seckill_consume_confirmed_total[5m]))
              + sum(rate(seckill_consume_cancelled_total[5m]))
              + sum(rate(seckill_consume_failed_total[5m]))
            )
          )
          and
          (
            (
              sum(rate(seckill_consume_confirmed_total[5m]))
              + sum(rate(seckill_consume_cancelled_total[5m]))
              + sum(rate(seckill_consume_failed_total[5m]))
            ) > 0
          )

      # -----------------------------------------------------------------------
      # 投递速率与确认速率之差 = 在途积压的增长速度（SPEC 的 mq_lag 近似）
      #
      # 【为什么这个近似是可接受的，以及它的边界在哪】
      # 它只在「单实例」下是准确的（两个计数都来自同一个进程，见 SeckillMetrics）。
      # 多实例部署时它会把「本实例投出、别的实例消费」读成积压。
      # 因此这条记录规则产出的序列被明确标注为 estimate（见告警里的命名），
      # 而 Broker 侧的 JMX 指标才是精确值 —— 后者打通后应当优先使用。
      # -----------------------------------------------------------------------
      - record: seckill:mq_lag_growth_rate:5m
        expr: |
          sum(rate(seckill_mq_sent_total[5m]))
          -
          sum(rate(seckill_consume_confirmed_total[5m]))

      # -----------------------------------------------------------------------
      # 待投递欠账的存量（直接读 Gauge，它来自数据库 COUNT，多实例下依然准确）
      # 这里只做一次 `max` 归并，避免多实例抓取时同一条曲线画两遍。
      # -----------------------------------------------------------------------
      - record: seckill:outbox_pending_now
        expr: max(seckill_outbox_pending) by (service)

      # -----------------------------------------------------------------------
      # 需人工介入的欠账总量（三条终态失败路径之和）
      # 这是「当前告警数」之外最该被盯住的一个数：它不会自愈。
      # -----------------------------------------------------------------------
      - record: seckill:manual_intervention_backlog
        expr: |
          max(seckill_outbox_failed) by (service)
          + max(seckill_compensate_pending) by (service)

  # ===========================================================================
  #  三、复合并发指标（供 Dashboard 使用）
  # ===========================================================================
  - name: seckill-composite
    interval: 30s
    rules:

      # -----------------------------------------------------------------------
      # 链路健康总分（0~1）：把四个关键不变量压成一个数
      #   ① 受理在推进（有 QPS）     ② 消费跟得上（成功率）
      #   ③ 没有欠账堆积             ④ 没有需人工介入的残留
      # 【它的用途与风险】用途是总览页一眼看健康度；
      # 风险是它会把「哪一项坏了」这个信息抹平，因此**不要**基于它写告警 ——
      # 告警必须指向具体的可行动项，否则收到告警的人第一件事是去查这四个分量。
      # -----------------------------------------------------------------------
      # 【它为什么还需要一个 or 兜底】总分是「成功率 × (1 − 错误率)」。
      # 两个因子都是记录规则算出来的，只要有一个为空，乘积就为空。
      # 上面已让错误率在无 5xx 时取 0，于是总分在「有消费活动」时一定存在；
      # 剩下的空窗是「系统完全空闲」（没有任何已结案消息）——
      # 那种情况下成功率本身不存在，而「空闲系统没有健康度」是正确语义，
      # 因此这里只兜「错误率缺失」这一种，不去伪造一个 1.0。
      - record: seckill:pipeline_health_score
        expr: |
          (
            clamp_max(seckill:order_success_rate:5m, 1)
            * clamp_max(1 - seckill:http_error_rate_all:5m, 1)
          )
          or
          (
            clamp_max(seckill:order_success_rate:5m, 1)
          )

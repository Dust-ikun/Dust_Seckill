# ============================================================================
#  测试专用配置覆盖（仅在 mvn test 时生效）
#
#  这里只放「测试需要、但生产不该用」的配置。Profile 文件是叠加在
#  src/main/resources/application.yaml 之上的，不需要重复声明数据源、Redis 等配置。
#
#  【为什么 max-reconsume-times 要覆盖成 1】
#  RocketMQ 的消费重试是带退避的（首次重试要等 10 秒，之后 30 秒、1 分钟……）。
#  若沿用生产的 3 次，一条「重试耗尽 → 回补」的链路要跑上百秒，无法放进单元测试。
#  覆盖成 1 之后第一次消费失败即视为重试耗尽，走的是完全相同的回补代码路径。
#
#  【重要】所有 @SpringBootTest 测试类都必须使用同一个 profile。
#  Spring 的上下文缓存以「配置组合」为键：只要有任何一个测试类用了不同的配置，
#  就会多创建一份上下文，而每个上下文都会启动一个 RocketMQ 消费者 ——
#  同一个消费组里出现两个消费者实例（即使在同一 JVM 内），Broker 会把队列对半分，
#  于是任何依赖「消费进度」的断言都只会看到自己那一半，产生假失败。
# ============================================================================

seckill:
  mq:
    max-reconsume-times: 1

  # 定时任务在测试里是干扰项：它会在断言中途偷偷改库存（对账修复）或重试补偿，
  # 让「预期值」变得不可预测。测试需要这些行为时都是显式手动调用的。
  maintenance:
    enabled: false


# ============================================================================
#  评审修复专项测试配置
#
#  【为什么单独开一个 profile】
#  test 那个 profile 走的是完整链路（真实 RocketMQ）。本类测试的目标是验证
#  「补偿 / 对账」这类与 MQ 无关的逻辑，没必要依赖 Broker 才能跑。
#  这里把 MQ 关掉，只保留 MySQL + Redis 依赖。
#
#  【不会引起「多消费者抢队列」的问题】mq.enabled=false 时根本不会创建消费者，
#  因此即使本 profile 与 test profile 各自建了一份 Spring 上下文，也不存在
#  同一消费组出现两个实例的情形。
#
#  【first-retry-delay-seconds 覆盖成 0】待补偿任务默认 10 秒后才到重试时间，
#  测试里希望「登记完立刻就能被重试任务捞到」。
#
#  【但只靠这一项不够，见 makeDue()】next_retry_time 是 DATETIME(0)，MySQL 对小数秒
#  向「上」四舍五入，所以配 0 延迟也可能被进位到下一秒，同一秒内触发 retryDue()
#  会一条都捞不到。测试里因此额外显式把任务置为已到期，不依赖亚秒级时序。
# ============================================================================

seckill:
  mq:
    enabled: false

  maintenance:
    # 关闭定时调度：测试里由用例显式调用 retryDue()，避免后台线程在断言中途改动状态
    enabled: false
    compensate:
      first-retry-delay-seconds: 0

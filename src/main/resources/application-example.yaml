server:
  port: 8081
spring:
  application:
    name: Dust-ikun_seckill
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seckill?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          # 秒杀场景下 Redis 命令是纯内存操作，连接数要足够大，避免请求线程排队等连接
          max-active: 200
          max-idle: 50
          min-idle: 10
          max-wait: 1000ms

# ----------------------------------------------------------------------------
# 运维端点与指标口径（与 application.yaml 保持一致，这份示例也需要）
#
# 【为什么直方图必须显式打开】Micrometer 默认只暴露 count / sum / max，
# 没有 histogram buckets 就没有 `le` 标签，于是
# histogram_quantile(0.99, ... http_server_requests_seconds_bucket) 查不到序列。
# 后果不是「P99 显示为 0」，而是 **P99 告警永远不会响**（规则停在 inactive，
# 不报错、不留痕）。实测过：漏配这一段会让
# ApiP99LatencyHigh / ApiSlowRequestRateHigh / SlowQuerySurge 三条告警全部静默失效。
#
# 【slo 里为什么必须显式写 1s】Micrometer 自动生成的是 1.048576×2ⁿ 那一族桶，
# **不含 1.0**（相邻边界是 0.984263336 与 1.073741824）。而记录规则
# seckill:http_slow_request_rate:5m 与告警 SlowQuerySurge 直接读 `le="1.0"`，
# 不显式声明就依然没有数据。
#
# 【lettuce 的仪表名】Redis 命令耗时来自 Spring Data Redis 的 Observation，
# 注册名是 `lettuce` / `lettuce.active`，标签是 db_operation ——
# 不是 lettuce.command.completion，写错名字同样匹配不到任何仪表。
# ----------------------------------------------------------------------------
management:
  server:
    port: 9091
    # 只绑回环：业务端口对外、运维端点仅本机可达。
    # Prometheus 跑在容器里时要改成 0.0.0.0（见 application-docker.yaml）。
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        lettuce: true
        lettuce.active: true
      slo:
        http.server.requests: 50ms, 100ms, 300ms, 1s, 2s
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 30s

# ----------------------------------------------------------------------------
# MyBatis 配置。
#
# 【为什么必须放在顶层】前缀是 mybatis，不是 spring.mybatis。
# mybatis-spring-boot-starter 只识别 mybatis.*；写成 spring.mybatis.* 既不报错也不生效，
# 结果是所有下划线列名静默映射不上（order_no / user_id / stock_id → null）。
# 这类缺陷不抛异常，只在下游拿 null 做决策时才暴露，比想象中难查得多。
# ----------------------------------------------------------------------------
mybatis:
  configuration:
    map-underscore-to-camel-case: true

seckill:
  # Snowflake 机器位（0~1023）。多实例部署时每个实例必须配置不同的值，否则单号会重复
  worker-id: 0

  # ---------------- RocketMQ 异步落库 ----------------
  mq:
    # 置为 false 时退化为「Redis 预扣 + 同步落库」，可在本机未启动 Broker 时调试其它功能
    enabled: true
    name-server: 127.0.0.1:9876
    producer-group: seckill-producer-group
    consumer-group: seckill-order-consumer-group
    topic: seckill-order-topic
    tag: create-order
    send-timeout-ms: 3000
    max-reconsume-times: 3
    consume-thread-min: 4
    consume-thread-max: 8

  # ---------------- 后台维护任务 ----------------
  # 待补偿任务重试 + 库存对账。
  maintenance:
    enabled: true
    compensate:
      interval-ms: 30000          # 待补偿任务扫描间隔
      batch-size: 100
      first-retry-delay-seconds: 10
      max-retry: 10               # 超过则标记 FAILED，等人工介入
    reconcile:
      interval-ms: 300000         # 对账间隔（5 分钟）
      auto-repair: false          # 默认只告警不改数据
      stale-pending-minutes: 90   # 「陈旧未了结」阈值；须大于最坏链路时延（投递退避 ≈19 分钟 + 消费重试）
      stock-ids: 1                # 纳入自动对账的活动 ID（逗号分隔），留空则只支持手动对账

  # ---------------- 本地消息表（Outbox） ----------------
  # 请求线程在 Redis 预扣后先写 seckill_outbox 再返回，后台投递器再把它投进 MQ。
  # 收益：Broker 不可用不再等于用户丢单；「已受理但未投出」的规模变成可查询的数据库状态。
  outbox:
    enabled: true                 # false 时回退到同步投递 MQ 的行为
    dispatch-interval-ms: 1000    # 投递器轮询间隔，决定「落库 → 进 MQ」的额外延迟
    batch-size: 500               # 单轮投递上限；批量发送后它直接决定投递吞吐（约 batch-size / 秒）
    max-retry: 15                 # 投递重试上限；用尽则同一事务里标记 FAILED + 登记「取消订单 + 归还预扣」待办
    first-retry-delay-seconds: 2  # 首次失败后的退避起点，之后指数退避，上限 5 分钟
    purge-interval-ms: 600000     # 归档清理间隔
    retention-hours: 24           # 已投递记录的保留时长
    purge-batch-size: 1000        # 归档每批删除条数，避免长事务

# =============================================================================
#  docker profile：中间件全部跑在 Docker 里时的应用配置
#
#  启动方式：
#    mvn package -DskipTests
#    java -jar target/seckill-0.0.1-SNAPSHOT.jar --spring.profiles.active=docker
#
#  【这个 profile 存在的理由，以及它刻意不做的事】
#
#  application.yaml 里的连接信息指向 localhost 的**标准端口**（3306/6379/9876），
#  那是「中间件用原生安装方式跑在本机」的形态，也是接手本项目时最容易复现的形态 ——
#  因此那些默认值必须保留，不能被改动。
#
#  本 profile 只覆盖「因为容器化而必须改变」的那些项，一共三类：
#    ① MySQL 从 3306 → 3307（本机已有原生 MySQL84 占用 3306，两者并存）
#    ② management.server.address 从 127.0.0.1 → 0.0.0.0（Prometheus 在容器里，
#       经 host.docker.internal 访问宿主机，绑回环会连不上）
#    ③ 打开 HTTP 直方图（P95/P99 的前提）与 AI Monitor 的 LLM 配置
#
#  除此之外一律不动：凡是不在这里出现的项，都等于「沿用 application.yaml」。
#  这样「docker 环境与原生环境的差异」本身就是一份可读的清单，
#  而不是两份需要逐行比对的配置文件。
# =============================================================================

# -----------------------------------------------------------------------------
# 运维端点的监听地址
#
# 【这是一处必须被理解的放宽】application.yaml 里绑定 127.0.0.1 是一个安全设计：
# 「业务端口对外 + 运维端点仅本机可达」两个目标同时成立，不需要引入 Spring Security。
#
# 但 Prometheus 跑在容器里，它访问宿主机是通过 Docker 网桥（host.docker.internal
# → 宿主机的网桥地址），**从宿主机的角度看这不是回环连接** ——
# 绑 127.0.0.1 时容器连不上，表现为 Prometheus 里 up{job="order-service"} == 0，
# 而应用日志一切正常。
#
# 因此这里放宽为 0.0.0.0。代价与对冲：
#   - 代价：同一局域网内的其它机器也能访问 9091，而 /actuator/health 打开了
#     show-details: always（会暴露 DB / Redis 的连接状态与错误信息）；
#   - 对冲：本机运行 Docker Desktop 时，网桥是虚拟网卡而非真实网卡，
#     没有引入新的外部可达面；若部署到 Linux 服务器，应当改为给 actuator
#     单独配一张内网地址，而不是 0.0.0.0。
# -----------------------------------------------------------------------------
management:
  server:
    address: 0.0.0.0

spring:
  datasource:
    # 【这里为什么不再让开端口】本文件最初写的是 localhost:3307 ——
    # 那时原生 MySQL84 占着 3306，容器只能让开。决定「本机中间件全删、只用 Docker」
    # 之后 3306 空出来了，端口回到标准值，application.yaml 的连接串原样可用。
    #
    # 仍然保留 ${MYSQL_HOST_PORT:3306} 这种写法而不是删掉整段：
    # 它让「改 .env 一处 → 容器与应用同时跟随」这条链路继续成立，
    # 需要临时换端口做对照实验时不必改代码。
    #
    # 【前提】容器 MySQL 与原生 MySQL84 不能同时占 3306。
    # 起容器前必须先停掉原生服务并禁用开机自启：
    #     Stop-Service MySQL84; Set-Service MySQL84 -StartupType Disabled
    url: jdbc:mysql://localhost:${MYSQL_HOST_PORT:3306}/seckill?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    # 【为什么默认值是空的】本文件会被提交，而远程仓库是公开的 —— 这里写过真实口令，
    # 等于把它发布了出去。默认值取空之后：本机用 scripts/run-app.ps1 启动时由 .env
    # 注入（脚本负责导出成环境变量）；有人忘了配置时会得到一个明确的认证失败，
    # 而不是悄悄用上一个公开的弱口令连上库。
    # 这与下面 seckill.monitor.llm.api-key 的 ${DEEPSEEK_API_KEY:} 是同一个写法与同一个理由。
    password: ${MYSQL_ROOT_PASSWORD:}

  data:
    redis:
      # 同理回到标准 6379。
      # ⚠️ 另一个项目 skychat-redis 也绑这个端口（当前已停止），两者不能同时启动。
      port: ${REDIS_HOST_PORT:6379}

# -----------------------------------------------------------------------------
# 指标口径（HTTP 直方图 / SLO 边界）已上移到 application.yaml
#
# 【为什么搬走】它原先只写在本 profile 里，于是用默认 profile 启动时
# P99 / P95 / 慢请求占比三条记录规则全部为空，`ApiP99LatencyHigh`、
# `ApiSlowRequestRateHigh`、`SlowQuerySurge` 三条告警静默失效（已实测确认）。
# 指标口径与「中间件跑在容器里还是本机」无关，因此不该随 profile 走 ——
# 留在这里只会制造「docker 环境有 P99、本机环境没有」这种最难排查的差异。
#
# 另外原配置里的 `lettuce.command.completion` 匹配不到任何仪表：
# Redis 命令耗时来自 Spring Data Redis 的 Observation，注册名是
# `lettuce` / `lettuce.active`（标签 db_operation，不是 command）。
# 这一处也已在 application.yaml 一并修正。
#
# ⚠️ 【补充修正（批次 1）】搬到 application.yaml 之后它被放在了 `spring.metrics` 下，
# 而 Boot 4.0.8 的正确前缀是 `management.metrics` —— 于是**它依然没生效**，
# 只是失效方式从「只在默认 profile 失效」变成了「所有 profile 都失效」：
# `/actuator/prometheus` 里 `http_server_requests_seconds` 是 summary、
# 一个 `le=` 桶都没有，P99/P95/慢请求三条记录规则全是空序列。
# 已修正为 management.metrics，判定依据与实测命令见 application.yaml 的对应注释。
# 这里的教训值得单独记住：「搬了位置」不等于「修好了」，而当时没有人去出口上验证一次。
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
#  RocketMQ：与 application.yaml 完全一致（容器把端口原样发布到了宿主机）。
#  这里显式重复写出来，是为了让本 profile 单独可读 ——
#  读它的人不必回头去翻 application.yaml 才知道 MQ 用的是哪个地址。
# -----------------------------------------------------------------------------
seckill:
  mq:
    enabled: true
    name-server: 127.0.0.1:9876

  # ===========================================================================
  #  AI Monitor Agent（SPEC 第 8 / 9 / 23 节）
  #
  #  【设计取向】下面每一项的默认值都取「最保守」的那一侧：
  #  功能默认关闭、调用次数上限取小、超时取短、脱敏默认开启。
  #  理由是这份配置的读者多半在第一次跑故障注入实验 ——
  #  此时一个「默认就把 API Key 发出去」或「默认允许 100 次 Tool 调用」的系统，
  #  会让第一次实验就烧掉预算或跑飞。要放开必须显式改，改动本身即是一次确认。
  # ===========================================================================
  monitor:
    enabled: true

    # -------------------------------------------------------------------------
    # LLM 接入（手写 OpenAI 兼容客户端，不引入 Spring AI）
    #
    # 【为什么不用 Spring AI】本地 Maven 仓库里的 Spring AI 是 1.1.8，
    # 它依赖 Spring Boot 3.5.15；本项目是 Spring Boot 4.0.8（Spring Framework 7）。
    # 这与 README 里记录的 RocketMQ 情形完全同构 —— 强行引入会把 Spring Framework 6
    # 拖进 classpath，启动即失败。本项目的 LLM 交互只有两件事：
    # 「发一轮 messages + tools」与「解析 tool_calls」，用 JDK 21 自带的
    # java.net.http.HttpClient 加 Jackson 手写不到 200 行，
    # 换来的是零版本冲突、且 ReAct 循环、次数上限、参数校验全部显式可见。
    #
    # 【api-key 的默认值为空字符串，这是刻意的】空值时 Agent 进入
    # 「未配置 LLM」的降级态：仍然接收并落库 Alert、仍然执行 Incident 聚合，
    # 只是不产出 Diagnosis。这样做的收益是：
    #   - 没有 Key 的人可以直接启动项目、跑通监控链路、看到告警；
    #   - 也正好验证了 SPEC 第 18 节「AI 失败 ≠ 监控失败」这条约束。
    # 真实 Key 只通过环境变量注入，不写进任何被提交的文件。
    # -------------------------------------------------------------------------
    llm:
      enabled: true
      # 默认指向 DeepSeek 的 OpenAI 兼容端点。换成任何兼容实现
      # （OpenAI / 通义 / Kimi / 本地 vLLM）都只需改这一行和 model。
      base-url: https://api.deepseek.com/v1
      chat-path: /chat/completions
      model: deepseek-chat
      api-key: ${DEEPSEEK_API_KEY:}

      # 单次请求超时。SPEC 第 18 节要求「LLM Timeout → Retry 1~2 次 → 失败则
      # 保存原始 Alert，普通监控继续生效」。30s 是「一次带工具结果的推理」的
      # 合理上界：更短会把正常的慢推理误判成故障，更长会让单次诊断突破
      # SPEC 第 25 节的「单次诊断 < 10s」目标。
      timeout-ms: 30000
      connect-timeout-ms: 5000

      # 重试次数（不含首次）。SPEC 第 18 节写明「Retry 1~2 次」。
      # 只对「可重试的失败」生效：超时、5xx、429。
      # 4xx（除 429）不重试 —— 那说明请求本身有问题，重试只是浪费三次配额。
      max-retries: 2
      retry-backoff-ms: 1000

      # 输出上限。限制它的目的不是省钱，而是**限制 Agent 写出超长无效输出**：
      # Agent 的最终输出必须是一段结构化 JSON，4096 tokens 对
      # SPEC 第 11 节的 Diagnosis 结构而言已经非常宽裕。
      max-tokens: 4096
      # 取 0.1 而不是默认的 1.0：诊断需要的是**可复现的推理**，
      # 不是多样化的措辞。温度高会让同一份证据在两次诊断里得出不同结论，
      # 而「同一输入两次结果不一致」在排障场景下是致命的问题。
      temperature: 0.1

    # -------------------------------------------------------------------------
    # Agent 执行约束（SPEC 第 23 节的「关键约束」）
    # -------------------------------------------------------------------------
    agent:
      # 一次诊断最多允许的 Tool 调用次数（SPEC 第 23.2 节示例值就是 10）。
      # 它防的是「Agent 在证据不足时反复重试同一个工具」这类无限循环 ——
      # 这类循环不会自己停下来，且每一次都要付费。
      max-tool-calls: 10
      # 单次 Tool 执行的超时（SPEC 第 25 节：Tool 单次调用 < 1s）。
      # 这里给 3s 而不是 1s：1s 是**目标值**而不是**熔断值**。
      # 把熔断值设成等于目标值，会让任何一次轻微抖动都变成工具失败，
      # Agent 于是拿不到证据却要下结论 —— 那比慢一点更糟。
      tool-timeout-ms: 3000
      # 整次诊断的墙钟超时（SPEC 第 25 节：单次诊断 < 10s）。
      # 超时后任务落 FAILED，但**已收集的证据与 Trace 全部保留** ——
      # 一次超时的诊断仍然是有价值的排障材料。
      max-duration-ms: 60000
      # 判定「证据充分」所需的最少独立证据条数（SPEC 第 10 节诊断规则第 3 条：
      # 「根因判断至少需要两个独立证据」）。这个数写在配置里而不是代码里，
      # 是因为它是**提示词的约束**而不是算法的约束，调它属于调 prompt 的一部分。
      min-evidence-count: 2

    # -------------------------------------------------------------------------
    # Tool 输出体积限制（SPEC 第 23.3 节：Token 限制）
    #
    # SPEC 的原话是「不要直接把大量原始日志全部传给 LLM」。这三个数值
    # 是实现那句话的地方 —— 它们决定的是**成本与信噪比**，不是正确性：
    # 把 10 万行日志塞进上下文既贵又会让关键信息被淹没。
    # -------------------------------------------------------------------------
    tool:
      logs:
        # 单次 search_logs 最多返回的日志条数
        max-samples: 20
        # 单条日志的最大字符数（超长异常堆栈会被截断，保留头尾）
        max-sample-chars: 500
        # 相同内容的日志去重后再计入 max-samples。
        # 【为什么去重比限流更重要】一次数据库故障会产生几千行**完全相同**的
        # 异常堆栈，限流只会随机留下其中 20 行 —— 而 Agent 需要的是
        # 「有哪几种不同的错误」而不是「同样的错误出现了几次」。
        dedupe: true
      # 单次 Tool 返回的 JSON 序列化后最大字符数。超过即截断并标注 truncated=true。
      # 这个上限同时保护 LLM 上下文与 ai_tool_execution.result 列。
      max-result-chars: 8000

      # -----------------------------------------------------------------------
      # Prometheus 查询（Metrics Tool 与 MQ Tool 共用）
      #
      # 【为什么 base-url 是 localhost 而不是容器名】应用跑在宿主机、Prometheus 在容器里，
      # 但 compose 把 9090 原样发布到了宿主机，因此从应用侧看它就是 localhost。
      # 这一点与 `prometheus.yml` 里 `order-service` 目标必须写 `host.docker.internal`
      # 恰好相反 —— 因为那边的方向是「容器访问宿主机」。两个方向写成一样的地址，
      # 必然有一边连不上，而症状都是「指标查不到」。
      # -----------------------------------------------------------------------
      prometheus:
        base-url: http://localhost:9090
        # 单次 HTTP 查询超时。必须**小于** agent.tool-timeout-ms（3000）：
        # 否则超时会由外层先触发，日志里就失去了「是 Prometheus 慢」这条线索。
        timeout-ms: 2000
        # 区间查询步长。与 prometheus.yml 的 15s 采集周期一致。
        query-step-seconds: 15
        # 区间查询返回的最大点数。它是「模型把时间窗写成 7 天」时的兜底：
        # 超过它时步长会自动放大，而不是返回上万个点再被截断干净。
        max-points: 240

      # -----------------------------------------------------------------------
      # 数据库只读查询（DB Tool）
      #
      # 【四道闸门的各自职责】
      #   max-rows             SQL 里的 LIMIT 值；JdbcTemplate.maxRows 是同一上界的硬兜底
      #   query-timeout-seconds 数据库侧的查询超时 —— 它是 agent.tool-timeout-ms 之外的第二道，
      #                         Tool 超时让 Agent 不必再等，这一道让数据库也停下来
      #   slow-sql-*           慢 SQL 的入选门槛与条数
      # -----------------------------------------------------------------------
      db:
        max-rows: 50
        slow-sql-top-n: 10
        # 平均耗时门槛（秒）。performance_schema 里的单位是皮秒，应用侧换算后再比较。
        slow-sql-min-seconds: 1.0
        query-timeout-seconds: 2

    # -------------------------------------------------------------------------
    # 脱敏（SPEC 第 17.2 节）
    #
    # 【默认全部开启，且没有「关闭开关」】SPEC 列出了禁止发送给 LLM 的六类信息
    # （密码 / Token / 身份证 / 银行卡 / 完整账户信息 / 连接串）。这里刻意
    # **不提供**一个 mask.enabled=false 的总开关：
    # 一个可以被关掉的合规开关，在赶工时一定会被关掉，而且关掉之后没有任何痕迹。
    # 需要放开某一条时，应当改代码并 code review，而不是改配置。
    #
    # 下面能调的只有「阈值」：手机号 / 用户 ID 这类信息在排障时可能确实需要
    # 部分可见（例如按 userId 追踪某位用户的下单链路），因此给出保留位数的选项。
    # -------------------------------------------------------------------------
    mask:
      # userId / orderNo 等标识符保留末尾几位，便于人工核对而不泄露全量
      keep-tail-chars: 4
      # 日志中出现这些关键字时，其后的值一律整体替换为 ***
      secret-keywords:
        - password
        - passwd
        - pwd
        - token
        - secret
        - api-key
        - apikey
        - authorization
        - cookie
        - private-key
      # 命中这些正则的内容一律替换。
      #
      # 【写这里的正则只有一条纪律：把**值本身**放进第 1 个分组】
      # 例如要脱 `password=abc123`，写 `password=(\S+)`（只脱值、保留字段名），
      # **不要**写 `(password=)(\S+)` —— 那样连字段名一起换成 *** ，
      # 读日志的人就看不出这里原本是个口令字段了。
      # 实测差异：`password=abc123` 前者得 `password=***`，后者得 `***abc123`。
      patterns:
        # 中国手机号
        - '\b(1[3-9]\d{9})\b'
        # 18 位身份证
        - '\b(\d{17}[\dXx])\b'
        # 银行卡（16~19 位连续数字）
        - '\b(\d{16,19})\b'
        # ---------------------------------------------------------------------
        # 【这里刻意**不**再写一条 JDBC 口令规则】
        #
        # 曾经写过 `(?i)((?:password|pwd)=)([^&;,\s]+)`。它不只是冗余，而是**有害**的：
        # 上面 secret-keywords 里的 password 已经把值换成 `***`，
        # 这条规则接着把 `***` 当成「一个新的值」再脱一遍，
        # 结果是 `password=******` —— 星号个数看起来像某种信息，
        # 实际上只是「同一段被脱了两遍」。已在 MaskerTest 里锁住这个行为。
        #
        # 需要新增规则时请照上面的纪律写，并跑一次
        # `mvn -o -B test -Dtest=MaskerTest` —— 脱敏是唯一一类
        # 「配错了也没有任何症状」的功能，测试是它唯一的防线。
        # ---------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # Incident 聚合（SPEC 第 16 节）
    #
    # 【为什么窗口是 60 秒】它必须大于「一次故障引发多个告警」的传播延迟。
    # 本项目实测：MySQL 慢查询从出现到 P99、错误率两条规则都进入 firing，
    # 受 Prometheus 的 `for: 30s` 与 15s 采集周期影响，最坏约 60~75 秒。
    # 窗口取小了会把同一个事故拆成两个任务（各付一次 LLM 费用、各查一遍指标）；
    # 取大了会把前后两次独立故障合并（Agent 会拿到矛盾的证据）。
    # 因此这个值应当随告警规则的 `for` 一起调整，而不是单独拍。
    # -------------------------------------------------------------------------
    incident:
      aggregate-window-seconds: 120
      # 聚合键：同服务 + 同异常类型 + 窗口内 → 一次诊断
      # SPEC 第 16 节的三个条件，逐条对应下面三项。
      # 把 service 与 alertType 一起作为键，不做「跨类型合并」——
      # 跨类型合并需要判断「P99 高 与 错误率高 是不是同一件事」，
      # 那正是 Agent 该做的推理，不该在聚合层替它下结论。
      aggregate-by: service,alertType
